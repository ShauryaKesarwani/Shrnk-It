[project]
name = "android-media-shrinker"
version = "0.1.0"
description = "Safely preview, compress, back up, and restore Android media over ADB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=13.0.0",
    "textual>=8.2.8",
]

[project.scripts]
android-media-shrinker = "pc_shrinker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pc_shrinker"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
